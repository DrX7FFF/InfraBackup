# machines/mediacenter.toml
# MediaCenter CoreELEC / Kodi

name = "mediacenter"
host = "mediacenter"  # alias défini dans ~/.ssh/config
user = ""             # omis — ssh lit le User depuis ~/.ssh/config

# 'include' : racines à sauvegarder intégralement. Ce sont des chemins passés
# tels quels à rsync (pas des motifs de filtre) — chaque entrée est copiée
# en entier, sauf ce qui est retiré via 'exclude' ci-dessous.
# On ne copie pas addons/ (binaires) — la liste des addons est dans le
# rapport "kodi-addons".
include = [
    # Config système
    "/storage/.config",
    # "/storage/.config/dockers/prowlarr/config.xml",
    # Kodi userdata
    "/storage/.kodi/userdata/*",
    # "/storage/.kodi/userdata/favourites.xml",
    # "/storage/.kodi/userdata/FondEcranSysteme.jpg",
    # "/storage/.kodi/userdata/guisettings.xml",
    # "/storage/.kodi/userdata/sources.xml",
    "/storage/.kodi/userdata/peripheral_data",
    "/storage/.kodi/userdata/playlists",
    "/storage/.kodi/userdata/addon_data/*/settings.xml",
    "/storage/.kodi/tools"
]

# 'exclude' : motifs passés à --exclude (sémantique rsync classique). Avec
# -R, la racine du transfert rsync est '/' : les motifs doivent donc être
# des chemins absolus complets, identiques aux chemins de 'include'.
exclude = [
    "/storage/.config/dockers/qbittorrent/qBittorrent/logs",
    "/storage/.config/dockers/qbittorrent/qBittorrent/BT_backup",
    "/storage/.config/dockers/qbittorrent/qBittorrent/qBittorrent-data.conf",
    # "/storage/.config/dockers/prowlarr",
]

# Rapports à générer (noms définis dans tools/reports.py)
reports = [
    "kodi-addons",
    "services",
    # "disques",
    "docker",
]

# git_repos non défini → module git_watch ignoré
